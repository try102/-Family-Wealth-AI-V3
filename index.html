<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V3.6

</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>

家庭财富 AI OS V3.6

</h1>

<!-- 财富驾驶舱 -->

<section class="dashboard">

<h2>

财富驾驶舱 Dashboard

</h2>

<div class="card">

<h3>

总资产

</h3>

<div id="totalAssets">

¥0

</div>

</div>

<div class="card">

<h3>

资产配置

</h3>

<div id="portfolio">

暂无数据

</div>

</div>

</section>

<!-- 功能中心 -->

<section>

<h2>

财富管理中心

</h2>

<div class="module-grid">

<div class="module-card">

📊

<h3>

资产管理

</h3>

<p>

管理股票、基金、房产、现金等资产

</p>

</div>

<div class="module-card">

💵

<h3>

收入现金流

</h3>

<p>

工资、投资收入、租金等

</p>

</div>

<div class="module-card">

📈

<h3>

投资分析

</h3>

<p>

组合分析、风险评估

</p>

</div>

<div class="module-card">

🧾

<h3>

税务规划

</h3>

<p>

税务优化与年度规划

</p>

</div>

<div class="module-card">

🏖

<h3>

退休规划

</h3>

<p>

退休现金流与目标分析

</p>

</div>

<div class="module-card">

🏠

<h3>

遗产规划

</h3>

<p>

家庭财富传承规划

</p>

</div>

<div class="module-card">

🤖

<h3>

AI 财富顾问

</h3>

<p>

智能财富分析助手

</p>

</div>

</div>

</section>

<!-- 添加资产 -->

<section>

<h2>

资产录入

</h2>

<div class="asset-form">

<input

id="assetName"

placeholder="资产名称"

>

<select id="assetCategory">

<option value="">

选择资产类别

</option>

<option value="现金">

现金

</option>

<option value="股票">

股票

</option>

<option value="ETF">

ETF

</option>

<option value="基金">

基金

</option>

<option value="债券">

债券

</option>

<option value="房产">

房产

</option>

<option value="其他">

其他

</option>

</select>

<input

id="assetType"

placeholder="资产类型"

>

<input

id="assetCountry"

placeholder="国家"

>

<input

id="assetCurrency"

placeholder="币种"

>

<input

id="assetInstitution"

placeholder="机构"

>

<input

id="assetAmount"

type="number"

placeholder="金额"

>

<button onclick="addNewAsset()">

添加资产

</button>

</div>

</section>

<!-- 资产列表 -->

<section>

<h2>

资产列表

</h2>

<div id="assetList">

</div>

</section>

<script src="assets/assets.js"></script>

<script src="assets/portfolio.js"></script>

<script src="agents/incomeAgent.js"></script>

<script src="agents/taxAgent.js"></script>

<script src="agents/retirementAgent.js"></script>

<script src="app.js"></script>

</body>

</html>
