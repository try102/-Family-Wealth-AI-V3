<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V5.3

</title>

<style>

body{

font-family:Arial, sans-serif;

margin:20px;

background:#f5f5f5;

}

.card{

background:white;

padding:20px;

margin-bottom:20px;

border-radius:10px;

}

input,select{

display:block;

margin:8px 0;

padding:8px;

width:90%;

}

button{

padding:8px 15px;

margin:5px;

}

h1,h2,h3{

color:#333;

}

</style>

</head>

<body>

<h1>

Family Wealth AI OS V5.3

</h1>

<!-- ======================

财富驾驶舱

====================== -->

<div class="card">

<h2>

🏠 财富驾驶舱

</h2>

<p>

净资产：

<span id="netWorth">

¥0

</span>

</p>

<p>

总资产：

<span id="totalAssets">

¥0

</span>

</p>

<p>

年度收入：

<span id="totalIncome">

¥0

</span>

</p>

<p>

投资收益：

<span id="investmentReturn">

¥0

</span>

</p>

</div>

<!-- ======================

AI CFO

====================== -->

<div class="card">

<h2>

🤖 AI CFO

</h2>

<button onclick="generateCFOReport()">

生成财富报告

</button>

<div id="cfoReport">

等待生成财富分析报告...

</div>

</div>

<!-- ======================

资产中心

====================== -->

<div class="card">

<h2>

💰 资产中心

</h2>

<input id="assetName"

placeholder="资产名称">

<input id="assetCategory"

placeholder="类别">

<input id="assetType"

placeholder="类型">

<input id="assetOwner"

placeholder="所有人">

<input id="assetCountry"

placeholder="国家">

<input id="assetCurrency"

placeholder="币种">

<input id="assetInstitution"

placeholder="机构">

<input id="assetAccount"

placeholder="账号">

<input id="assetCost"

placeholder="成本">

<input id="assetValue"

placeholder="当前价值">

<input id="assetNote"

placeholder="备注">

<button onclick="addNewAsset()">

添加资产

</button>

<div id="assetList">

</div>

</div>
<!-- ======================

收入中心

====================== -->

<div class="card">

<h2>

💵 收入中心

</h2>

<input id="incomeName"

placeholder="收入名称">

<input id="incomeCategory"

placeholder="类别">

<input id="incomeSource"

placeholder="来源">

<input id="incomeAmount"

placeholder="金额">

<input id="incomePeriod"

placeholder="周期">

<button onclick="addIncome()">

添加收入

</button>

<div id="incomeList">

</div>

</div>

<!-- ======================

投资中心 V5.3

====================== -->

<div class="card">

<h2>

📈 投资中心

</h2>

<h3>

新增投资

</h3>

<input id="investmentName"

placeholder="投资名称">

<input id="investmentTicker"

placeholder="代码">

<input id="investmentType"

placeholder="类型（股票/基金/债券等）">

<input id="investmentMarket"

placeholder="市场">

<input id="investmentCurrency"

placeholder="币种">

<h3>

📥 买入信息

</h3>

<input 

id="investmentBuyDate"

type="date">

<input 

id="investmentBuyPrice"

type="number"

placeholder="买入价格">

<input 

id="investmentBuyQuantity"

type="number"

placeholder="买入数量">

<input 

id="investmentBuyAmount"

type="number"

placeholder="买入金额（可选）">

<h3>

📤 卖出信息

</h3>

<input 

id="investmentSellDate"

type="date">

<input 

id="investmentSellPrice"

type="number"

placeholder="卖出价格">

<input 

id="investmentSellQuantity"

type="number"

placeholder="卖出数量">

<h3>

📦 当前持仓

</h3>

<input 

id="investmentCurrentPrice"

type="number"

placeholder="当前价格">

<input 

id="investmentCurrentValue"

type="number"

placeholder="当前市值（可选）">

<input 

id="investmentNote"

placeholder="备注">

<button onclick="addInvestment()">

添加投资

</button>

<div id="investmentList">

</div>

</div>

<!-- ======================

投资分析

====================== -->

<div class="card">

<h2>

📊 投资分析

</h2>

<div id="investmentDashboard">

</div>

</div>
