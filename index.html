<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS

</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>

Family Wealth AI OS

</h1>

<p>

AI驱动的家庭财富智能操作系统

</p>

</header>

<div class="layout">

<nav>

<h3>财富中心</h3>

<button>🏠 Dashboard</button>

<button>👨‍👩‍👧 家庭中心</button>

<button>💰 资产中心</button>

<button>💵 收入中心</button>

<button>📉 支出中心</button>

<button>📈 投资中心</button>

<button>🏦 负债中心</button>

<button>🧾 税务中心</button>

<button>🏖 退休规划</button>

<button>📄 文件中心</button>

<button>🤖 AI CFO</button>

</nav>

<main>

<section class="card">

<h2>

财富驾驶舱

</h2>
<section class="card">

<h2>

资产中心

</h2>

<div class="asset-form">

<input id="assetName"

placeholder="资产名称">

<input id="assetCategory"

placeholder="资产类别">

<input id="assetType"

placeholder="资产类型">

<input id="assetCountry"

placeholder="国家">

<input id="assetCurrency"

placeholder="币种">

<input id="assetInstitution"

placeholder="机构">

<input id="assetAccount"

placeholder="账户">

<input id="assetValue"

placeholder="当前价值">

<button onclick="addNewAsset()">

添加资产

</button>

</div>

<div id="assetList">

</div>

</section>
<div class="dashboard">

<div>

<h3>净资产</h3>

<p id="netWorth">

¥0

</p>

</div>

<div>

<h3>总资产</h3>

<p id="totalAssets">

¥0

</p>

</div>

<div>

<h3>年度收入</h3>

<p id="annualIncome">

¥0

</p>

</div>

<div>

<h3>投资收益</h3>

<p id="investmentReturn">

¥0

</p>

</div>

</div>

</section>

<section class="card">

<h2>

AI 今日建议

</h2>

<p id="aiAdvice">

系统正在等待数据...

</p>

</section>

<section class="card">

<h2>

财富模块状态

</h2>

<ul>

<li>资产 Agent：已连接</li>

<li>收入 Agent：已连接</li>

<li>投资 Agent：已连接</li>

<li>税务 Agent：准备中</li>

<li>退休 Agent：准备中</li>

</ul>

</section>

</main>

</div>

<script src="app.js"></script>

</body>

</html>
