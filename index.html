<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V4.0

</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>

Family Wealth AI OS

</h1>

<p>

家庭财富智能操作系统 V4.0

</p>

</header>

<div class="layout">

<nav>

<h3>

财富中心

</h3>

<button>

🏠 财富驾驶舱

</button>

<button>

💰 资产中心

</button>

<button>

💵 收入中心

</button>

<button>

📈 投资中心

</button>

<button>

🧾 税务中心

</button>

<button>

🏖 退休规划

</button>

<button>

🤖 AI CFO

</button>

</nav>

<main>

<section class="card">

<h2>

财富驾驶舱

</h2>

<div class="dashboard">

<div>

<h3>

净资产

</h3>

<p id="netWorth">

¥0

</p>

</div>

<div>

<h3>

总资产

</h3>

<p id="totalAssets">

¥0

</p>

</div>

<div>

<h3>

年度收入

</h3>

<p id="totalIncome">

¥0

</p>

</div>

<div>

<h3>

投资收益

</h3>

<p id="investmentReturn">

¥0

</p>

</div>

</div>

</section>

<section class="card">

<h2>

🤖 AI CFO

</h2>

<p>

家庭财富智能分析中心

</p>

<button onclick="generateCFOReport()">

生成财富报告

</button>

<div id="cfoReport">

<p>

等待生成财富分析报告...

</p>

</div>

</section>

<section class="card">

<h2>

资产中心

</h2>

<input id="assetName" placeholder="资产名称">

<br><br>

<input id="assetCategory" placeholder="资产类别">

<br><br>

<input id="assetType" placeholder="资产类型">

<br><br>

<input id="assetOwner" placeholder="所属人">

<br><br>

<input id="assetCountry" placeholder="国家">

<br><br>

<input id="assetCurrency" placeholder="币种">

<br><br>

<input id="assetInstitution" placeholder="机构">

<br><br>

<input id="assetAccount" placeholder="账户">

<br><br>

<input id="assetCost" placeholder="买入成本">

<br><br>

<input id="assetValue" placeholder="当前价值">

<br><br>

<input id="assetNote" placeholder="备注">

<br><br>

<button onclick="addNewAsset()">

添加资产

</button>

<div id="assetList">

</div>

</section>
<section class="card">

<h2>

收入中心

</h2>

<input id="incomeName" placeholder="收入名称">

<br><br>

<input id="incomeCategory" placeholder="收入类别">

<br><br>

<input id="incomeSource" placeholder="收入来源">

<br><br>

<input id="incomeAmount" placeholder="金额">

<br><br>

<input id="incomePeriod" placeholder="周期（月/年）">

<br><br>

<button onclick="addIncome()">

添加收入

</button>

<div id="incomeList">

</div>

</section>

<section class="card">

<h2>

投资中心

</h2>

<input id="investmentName" placeholder="投资名称">

<br><br>

<input id="investmentTicker" placeholder="股票代码">

<br><br>

<input id="investmentType" placeholder="投资类型（股票/ETF/基金/债券）">

<br><br>

<input id="investmentMarket" placeholder="市场">

<br><br>

<label>

买入日期

</label>

<input type="date" id="investmentBuyDate">

<br><br>

<input id="investmentBuyPrice" placeholder="买入价格">

<br><br>

<input id="investmentQuantity" placeholder="数量">

<br><br>

<input id="investmentBuyAmount" placeholder="买入金额">

<br><br>

<label>

卖出日期

</label>

<input type="date" id="investmentSellDate">

<br><br>

<input id="investmentSellPrice" placeholder="卖出价格">

<br><br>

<input id="investmentCurrentValue" placeholder="当前价值">

<br><br>

<input id="investmentNote" placeholder="备注">

<br><br>

<button onclick="addInvestment()">

添加投资

</button>

<div id="investmentList">

</div>

</section>

<section class="card">

<h2>

税务中心

</h2>

<p>

美国税务规划

</p>

<p>

中国税务规划

</p>

<p>

资本利得税

</p>

<p>

税务优化

</p>

</section>

<section class="card">

<h2>

退休规划

</h2>

<p>

退休年龄规划

</p>

<p>

退休现金流预测

</p>

<p>

医疗支出规划

</p>

<p>

资产消耗模型

</p>

</section>

</main>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
