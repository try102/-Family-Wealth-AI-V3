<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI Agent V3.5

</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>

家庭财富 AI Agent V3.5

</h1>

<h2>

财富总览

</h2>

<div id="totalAssets">

¥0

</div>

<h2>

添加资产

</h2>

<div class="asset-form">

<input

id="assetName"

placeholder="资产名称（例如 Apple）"

>

<select id="assetCategory">

<option value="">

选择资产类别

</option>

<option value="现金">

现金

</option>

<option value="股票">

股票

</option>

<option value="ETF">

ETF

</option>

<option value="基金">

基金

</option>

<option value="债券">

债券

</option>

<option value="房产">

房产

</option>

<option value="其他">

其他

</option>

</select>

<input

id="assetType"

placeholder="资产类型（例如 美股）"

>

<input

id="assetCountry"

placeholder="国家"

>

<input

id="assetCurrency"

placeholder="币种（例如 USD）"

>

<input

id="assetInstitution"

placeholder="机构（例如 Fidelity）"

>

<input

id="assetAmount"

type="number"

placeholder="金额"

>

<button onclick="addNewAsset()">

添加资产

</button>

</div>

<h2>

资产配置

</h2>

<div id="portfolio">

</div>

<h2>

资产列表

</h2>

<div id="assetList">

</div>

<script src="assets/assets.js"></script>

<script src="assets/portfolio.js"></script>

<script src="app.js"></script>

</body>

</html>
